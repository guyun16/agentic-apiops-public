[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-apiops-agentlab"
version = "0.1.0"
description = "Python AgentLab for Agentic APIOps experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jsonschema>=4.25,<5.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "typing-extensions>=4.14,<5.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
